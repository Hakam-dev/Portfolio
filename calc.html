<!DOCTYPE html>
<html>
<head>
    <title>CALCULATOR CLONE</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>

<div class="calculator"> 

    <input type="text" id="display" readonly>

    <div class="buttons">
    <button onclick="toggleMode()" id="modeBtn">Deg</button>    

    <button onclick="sinValue()">sin</button>
    <button onclick="cosValue()">cos</button> 
    <button onclick="tanValue()">tan</button>

    <button onclick="logValue()">log</button>
    <button onclick="lnValue()">ln</button>
    <button onclick="insertPi()">π</button>
    <button onclick="insertE()">e</button>

     <button onclick="squareRoot()">√</button>
    <button onclick="square()">x²</button>
    <button onclick="power()">xʸ</button>
    <button onclick="appendValue('%')">%</button>
    
    <button onclick="clearDisplay()">AC</button>
    <button onclick="deleteLast()">DEL</button>
    <button onclick="appendValue('(')">(</button>
    <button onclick="appendValue(')')">)</button>


    <button onclick="appendValue('7')">7</button>
    <button onclick="appendValue('8')">8</button>
    <button onclick="appendValue('9')">9</button>
    <button onclick="appendValue('/')">÷</button>

    <button onclick="appendValue('4')">4</button>
    <button onclick="appendValue('5')">5</button>
    <button onclick="appendValue('6')">6</button>
    <button onclick="appendValue('*')">×</button>


    <button onclick="appendValue('1')">1</button>
    <button onclick="appendValue('2')">2</button>
    <button onclick="appendValue('3')">3</button>
    <button onclick="appendValue('-')">−</button>
    

    <button onclick="appendValue('0')">0</button>
    <button onclick="appendValue('.')">.</button>
    <button onclick="calculate()">=</button>
    <button onclick="appendValue('+')">+</button>

</div>

</div>

<script src="calc.js"></script>

</body>
</html>
